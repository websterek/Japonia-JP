name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare build tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          echo "$RUNNER_TEMP/site-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/site-venv/bin/python" -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 beautifulsoup4==4.13.4 playwright==1.55.0
      - name: Restore licensed photograph cache
        uses: actions/cache@v4
        with:
          path: .photo-cache
          key: japonia-photographs-v1-${{ hashFiles('presentation/build.py') }}
          restore-keys: japonia-photographs-v1-
      - name: Build photographic presentation
        run: python presentation/build.py
      - name: Test desktop and mobile rendering
        run: python presentation/check.py
      - name: Save reviewed presentation and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-preview
          path: |
            preview/
            _site/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website and photographs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python presentation/verify_public.py
