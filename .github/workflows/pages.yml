name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            http_code="$(curl --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/public-page.html" \
              --write-out '%{http_code}' "$SITE_URL" || true)"
            if [[ "$http_code" == "200" ]] && grep -q 'Japonia 2027' "$RUNNER_TEMP/public-page.html"; then
              echo "Verified: HTTP 200; itinerary present; URL: $SITE_URL"
              printf '### Published website\n\n[%s](%s)\n\nVerified HTTP 200 and itinerary content without authentication.\n' "$SITE_URL" "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $http_code; publication not yet verified."
            sleep 5
          done
          echo '::error::Public website did not return HTTP 200 with the expected itinerary.'
          exit 1
